spring:
  config:
    import: "optional:file:./.env[.properties]" # 프로젝트 루트 환경 변수 파일 로드

  application:
    name: spring-ai-rag-lab

  main:
    web-application-type: none # Non-Web CLI 실행 구성

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  ai:
    model:
      chat: ollama # Ollama Chat Model 사용
      embedding: ollama # Ollama 임베딩 모델 사용

    ollama:
      base-url: http://localhost:11434
      init:
        pull-model-strategy: never # 애플리케이션 시작 시 모델 다운로드 제외
      chat:
        model: ${OLLAMA_CHAT_MODEL} # 환경 변수 기반 Chat Model 지정
      embedding:
        model: qwen3-embedding:0.6b # 임베딩 모델 고정

    vectorstore:
      pgvector:
        initialize-schema: true # pgvector 스키마 자동 초기화

rag:
  document:
    enabled: false # 문서 처리 CLI 실행 여부
    source-pdf: documents/source/graph-engineering-v2026.08.02.pdf

  retrieval:
    enabled: false # 벡터 검색 CLI 실행 여부
    store: false # 문서 청크 저장 여부
    search: false # 유사도 검색 여부
    question: ""
    top-k: 5
    similarity-threshold: 0.0

  generation:
    enabled: false # RAG 답변 생성 CLI 실행 여부
    question: "" # 수동 RAG·Advisor 공통 질문
    top-k: 5 # 공통 검색 결과 수
    similarity-threshold: 0.7 # 공통 유사도 임계값

  evaluation:
    enabled: false # 검색·생성 품질 평가 CLI 실행 여부
    questions-path: evaluation/questions.json # 평가 질문 파일 경로
    results-path: evaluation/results/phase4-results.json # 자동 평가 결과 파일 경로
    top-k: 5 # 평가 검색 결과 수
    similarity-threshold: 0.7 # 평가 유사도 임계값

  improvement:
    enabled: false # 검색 방식 개선 CLI 실행 여부
    questions-path: evaluation/questions.json # Phase 4 평가 질문 경로
    baseline-results-path: evaluation/results/phase4-results-reviewed.json # Phase 4 기준 결과
    results-path: evaluation/results/phase5-search-results.json # Phase 5 검색 결과
    keyword-top-k: 5 # 키워드 검색 결과 수
    vector-top-k: 5 # 벡터 검색 결과 수
    similarity-threshold: 0.7 # 벡터 검색 유사도 임계값
    rrf-k: ${RAG_IMPROVEMENT_RRF_K} # RRF 실험 기준값
    candidate-count: 20 # 리랭킹 입력 후보 수
    final-top-k: 5 # 최종 검색 결과 수
    reranking-enabled: false # 리랭킹 적용 여부